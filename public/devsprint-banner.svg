<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001124" />
      <stop offset="45%" stop-color="#002855" />
      <stop offset="100%" stop-color="#00629B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FFA300" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="1100" cy="120" r="280" fill="#00B5E2" opacity="0.18" />
  <circle cx="100" cy="550" r="250" fill="#FF6A00" opacity="0.15" />
  <circle cx="600" cy="315" r="350" fill="#00629B" opacity="0.25" />

  <!-- Technical Circuit Lines -->
  <g stroke="#00B5E2" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M 0 180 L 320 180 L 400 260 L 750 260" />
    <circle cx="750" cy="260" r="4" fill="#00B5E2" />
    <path d="M 1200 450 L 880 450 L 800 370 L 520 370" />
    <circle cx="520" cy="370" r="4" fill="#FFA300" />
    <path d="M 950 0 L 950 140 L 1020 210 L 1200 210" />
  </g>

  <!-- Content Container -->
  <!-- Top Branding Bar -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="380" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="rgba(0,181,226,0.6)" stroke-width="1.5" />
    <circle cx="18" cy="18" r="5" fill="#00B5E2" />
    <text x="34" y="23" font-family="Segoe UI, Montserrat, sans-serif" font-size="13" font-weight="700" fill="#00B5E2" letter-spacing="1">
      IEEE COMPUTER SOCIETY • UCET IUB
    </text>

    <rect x="760" y="0" width="280" height="36" rx="18" fill="#FF6A00" opacity="0.95" />
    <text x="900" y="23" font-family="Segoe UI, Montserrat, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      UPCOMING CHAPTER EVENT
    </text>
  </g>

  <!-- Event Title & Subhead -->
  <g transform="translate(80, 160)">
    <text x="0" y="30" font-family="Segoe UI, Montserrat, sans-serif" font-size="20" font-weight="700" fill="#FFA300" letter-spacing="2">
      ANNUAL CODE SPRINT &amp; BOOTCAMP 2026
    </text>
    <text x="0" y="105" font-family="Segoe UI, Montserrat, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      IEEE DevSprint 2026
    </text>
    <text x="0" y="152" font-family="Segoe UI, Montserrat, sans-serif" font-size="24" font-weight="600" fill="#00B5E2">
      Autonomous AI Agents • Cloud Infrastructure • Full-Stack Systems
    </text>
    <text x="0" y="200" font-family="Segoe UI, Open Sans, sans-serif" font-size="16" fill="#E5E7EB">
      An intensive, hands-on development bootcamp diving into multi-agent systems, Next.js 15,
    </text>
    <text x="0" y="226" font-family="Segoe UI, Open Sans, sans-serif" font-size="16" fill="#E5E7EB">
      cloud-native architectures, and cryptographic credential verification on campus.
    </text>
  </g>

  <!-- Event Metadata Grid Footer -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="320" height="75" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)" />
    <text x="20" y="28" font-family="Segoe UI, Montserrat, sans-serif" font-size="12" font-weight="700" fill="#00B5E2" letter-spacing="1">
      DATE &amp; TIME (PKT)
    </text>
    <text x="20" y="54" font-family="Segoe UI, Montserrat, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
      Sat, Nov 28, 2026 • 09:00 AM
    </text>

    <rect x="340" y="0" width="360" height="75" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)" />
    <text x="360" y="28" font-family="Segoe UI, Montserrat, sans-serif" font-size="12" font-weight="700" fill="#00B5E2" letter-spacing="1">
      LOCATION / VENUE
    </text>
    <text x="360" y="54" font-family="Segoe UI, Montserrat, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
      UCET Auditorium &amp; Lab 1.25, IUB
    </text>

    <rect x="720" y="0" width="320" height="75" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)" />
    <text x="740" y="28" font-family="Segoe UI, Montserrat, sans-serif" font-size="12" font-weight="700" fill="#FFA300" letter-spacing="1">
      ACCESS &amp; REGISTRATION
    </text>
    <text x="740" y="54" font-family="Segoe UI, Montserrat, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
      Free Entry • Cryptographic Cert
    </text>
  </g>
</svg>
