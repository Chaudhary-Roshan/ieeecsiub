name: Supabase Database Auto-Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-sync.yml'
  workflow_dispatch:

jobs:
  deploy-database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Schema to Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN secret in GitHub Repository Settings."
            echo "Please add SUPABASE_ACCESS_TOKEN at https://github.com/Chaudhary-Roshan/ieeecsiub/settings/secrets/actions"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing SUPABASE_DB_PASSWORD secret in GitHub Repository Settings."
            echo "Please add SUPABASE_DB_PASSWORD at https://github.com/Chaudhary-Roshan/ieeecsiub/settings/secrets/actions"
            exit 1
          fi

          REF="${SUPABASE_PROJECT_ID:-gbuafbcebcbwzvefqhcr}"
          echo "Linking to Supabase project ref: $REF"
          supabase link --project-ref "$REF" --password "$SUPABASE_DB_PASSWORD"

          echo "Applying migrations to live database..."
          supabase db push --password "$SUPABASE_DB_PASSWORD"
